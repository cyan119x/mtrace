name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned development and OpenClaw dependencies
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/mtrace-openclaw" --no-save --package-lock=false openclaw@2026.9.6
      - name: Synthetic and SDK tests
        run: OPENCLAW_PACKAGE_ROOT="$RUNNER_TEMP/mtrace-openclaw/node_modules/openclaw" npm run test:local
      - name: Build, validate and pack plugin
        run: |
          export PATH="$RUNNER_TEMP/mtrace-openclaw/node_modules/.bin:$PATH"
          npm run build
          npm run validate
          openclaw plugins pack --out ./mtrace-ci.tgz --json
